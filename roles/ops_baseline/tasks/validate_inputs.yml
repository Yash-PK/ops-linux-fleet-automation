---
- name: Validate bounded configuration before remote mutations
  ansible.builtin.assert:
    that:
      - ops_baseline_web_port is integer
      - ops_baseline_web_port == 80
      - ops_baseline_web_content is string
      - ops_baseline_web_content is match('^[A-Za-z0-9 ._:-]{1,80}\Z')
      - ops_baseline_observer_user is string
      - ops_baseline_observer_user is match('^ops-[a-z][a-z0-9-]{1,24}\Z')
      - ops_baseline_observer_user != 'ops-control'
      - ops_baseline_observer_group is string
      - ops_baseline_observer_group is match('^ops-[a-z][a-z0-9-]{1,24}\Z')
      - ops_baseline_observer_group != 'ops-control'
      - ops_baseline_journal_max_mib is integer
      - ops_baseline_journal_max_mib >= 16
      - ops_baseline_journal_max_mib <= 256
    quiet: true
    fail_msg: Invalid baseline configuration; no baseline mutation has started
