---
- name: Reload validated SSH
  ansible.builtin.systemd_service:
    name: "{{ ops_baseline_ssh_service }}"
    state: reloaded

- name: Restart chrony
  ansible.builtin.systemd_service:
    name: "{{ ops_baseline_chrony_service }}"
    state: restarted

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Reload owned nftables rules
  ansible.builtin.systemd_service:
    name: ops-baseline-firewall
    state: reloaded
    daemon_reload: true

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

- name: Restart sandboxed nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: restarted
    daemon_reload: true
